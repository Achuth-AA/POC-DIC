<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calls and Chats</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .turns { display: grid; gap: 12px; }
    .turn { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; }
    .turn__bubble { overflow-wrap: anywhere; }
    .turn__who { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 9px; text-align: right; }
    .turn__bubble { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
    .turn--user .turn__bubble { background: var(--surface-2); }
    .turn--system .turn__bubble { background: transparent; border-style: dashed; color: var(--muted); font-size: 12.5px; }
    .turn__text { margin: 0; }
    .turn__meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .turn__meta .stack { width: 180px; }
    .turn__src { font-size: 12px; margin-top: 6px; color: var(--accent-2); }
    .turn__tool { margin-top: 8px; font-size: 12px; background: #fdf2f8; border: 1px solid #f5cbe1; border-radius: 8px; padding: 6px 8px; }
    .turn__note { margin-top: 6px; font-size: 12px; color: var(--warn); }
    .stack-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .stack-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  </style>
</head>
<body data-page="calls">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main">
        <div class="page-head">
          <div>
            <h1>Calls &amp; chats</h1>
            <p>Every turn with its route, sources, model version and latency breakdown. This is the audit trail.</p>
          </div>
          <div class="toolbar">
            <div class="seg" role="group" aria-label="Channel" id="channelSeg">
              <button type="button" data-ch="" aria-pressed="true">All</button>
              <button type="button" data-ch="voice" aria-pressed="false">📞 Voice</button>
              <button type="button" data-ch="chat" aria-pressed="false">💬 Chat</button>
            </div>
          </div>
        </div>

        <div class="grid grid--1-2">
          <section class="card">
            <div class="card__head"><div><h2>Sessions</h2><p id="sessCount"></p></div></div>
            <div class="card__body card__body--flush table-wrap"><table class="data" id="sessions"></table></div>
          </section>
          <section class="card" id="detail" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>
  <script src="js/mock-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/calls.js"></script>
</body>
</html>
