<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Base</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .dropzone { border: 2px dashed #b9c4da; border-radius: var(--radius); padding: 22px; text-align: center; background: var(--surface-2); transition: background .15s, border-color .15s; }
    .dropzone.is-over { background: var(--accent-soft); border-color: var(--accent); }
    .dropzone strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .upload-opts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
    .upload-opts label { display: inline-flex; gap: 6px; align-items: center; }
    .chunk { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
    .chunk__meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; flex-wrap: wrap; }
    .chunk p { margin: 0; }
    .hit { border-left: 3px solid var(--accent); }
    .score { font-weight: 700; color: var(--accent-2); }
    .answer { background: #f2f8f4; border: 1px solid #cde9d6; border-radius: 10px; padding: 12px 14px; }
    .answer__label { font-size: 12px; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .progress { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; width: 120px; }
    .progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
    .pipeline { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
    .pipeline span { padding: 3px 8px; border-radius: 6px; background: var(--track); color: var(--muted); }
    .pipeline span.done { background: var(--ok-bg); color: var(--ok); }
  </style>
</head>
<body data-page="knowledge">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="main">
        <div class="page-head">
          <div>
            <h1>Knowledge base</h1>
            <p>One knowledge base for the voice bot, web chat and agent assist. Only <strong>published</strong> documents are searched; <strong>internal</strong> ones are visible to officers only.</p>
          </div>
        </div>

        <div class="grid grid--3-1">
          <section class="card">
            <div class="card__head">
              <div><h2>Documents</h2><p id="docCount"></p></div>
              <div class="toolbar">
                <input type="search" id="docSearch" placeholder="Search documents" aria-label="Search documents">
                <select id="docFilter" aria-label="Filter by status">
                  <option value="">All statuses</option><option value="published">Published</option><option value="draft">Draft</option><option value="processing">Processing</option>
                </select>
              </div>
            </div>
            <div class="card__body card__body--flush table-wrap"><table class="data" id="docs"></table></div>
          </section>

          <div class="grid" style="align-content:start">
            <section class="card">
              <div class="card__head"><div><h2>Upload</h2><p>PDF, DOCX, TXT, CSV, XLSX · max 50 MB</p></div></div>
              <div class="card__body">
                <label class="dropzone" id="dropzone">
                  <strong>Drop files here or click to choose</strong>
                  <span class="note">Files are parsed, split into chunks with page numbers, embedded and saved as a draft.</span>
                  <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.csv,.xlsx" class="sr-only">
                </label>
                <div class="upload-opts" role="group" aria-label="Upload options">
                  <label><input type="radio" name="aud" value="public" checked> Public</label>
                  <label><input type="radio" name="aud" value="internal"> Internal (officers only)</label>
                  <label><input type="checkbox" id="priority"> High priority (circular)</label>
                </div>
              </div>
            </section>
            <section class="card">
              <div class="card__head"><div><h2>Test a question</h2><p>Runs retrieval exactly as a live call would</p></div></div>
              <div class="card__body" style="display:grid;gap:10px">
                <form id="testForm" style="display:grid;gap:8px">
                  <textarea id="testQ" rows="2" aria-label="Question">What documents are needed to register?</textarea>
                  <div class="toolbar">
                    <select id="testAud" aria-label="Search as"><option value="public">As citizen (public only)</option><option value="internal">As officer (public + internal)</option></select>
                    <button class="btn btn--primary" type="submit">Search</button>
                  </div>
                </form>
                <div id="testOut"></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer__head">
      <div><h2 id="drawerTitle"></h2><div class="note" id="drawerSub"></div></div>
      <button type="button" class="icon-btn" id="drawerClose" aria-label="Close preview">✕</button>
    </div>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>

  <script src="js/mock-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/knowledge.js"></script>
</body>
</html>
