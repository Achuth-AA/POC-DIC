<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Callback Queue</title>
  <link rel="stylesheet" href="css/assist.css">
</head>
<body>
  <header class="bar">
    <a class="bar__brand" href="index.html"><span class="bar__mark" aria-hidden="true">VA</span><span><strong>Agent console</strong><small>Live assist · POC</small></span></a>
    <nav class="bar__nav" aria-label="Console">
      <a href="index.html">Live queue</a>
      <a href="callbacks.html" aria-current="page">Callbacks</a>
    </nav>
    <span class="bar__spacer"></span>
  </header>

  <main class="page">
    <div>
      <h1>Callbacks</h1>
      <p class="page-sub">Booked when no officer was free (for example, a web chat at 11 pm). Each one carries the AI summary and the full transcript.</p>
    </div>
    <div class="card"><table class="data" id="cbTable"></table></div>
  </main>
  <div class="toasts" role="status"></div>

  <script src="js/mock-data.js"></script>
  <script>
    (function () {
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const STATUS = { scheduled: ['tag', 'Scheduled'], due: ['tag tag--warn', 'Due now'], done: ['tag tag--ok', 'Done'] };
      const table = document.getElementById('cbTable');
      function render() {
        table.innerHTML = `<thead><tr><th>Ref.</th><th>When</th><th>Channel</th><th>Language</th><th>AI summary</th><th>Verified</th><th>Status</th><th><span class="sr-only">Action</span></th></tr></thead>
          <tbody>${ASSIST.callbacks.map((c, i) => `<tr>
            <td class="mono">${esc(c.ref)}</td><td>${esc(c.when)}</td><td>${c.channel === 'voice' ? '📞 Voice' : '💬 Chat'}</td><td>${esc(c.lang)}</td>
            <td>${esc(c.summary)}</td><td>${c.verified ? '<span class="tag tag--ok">✓ OTP</span>' : '<span class="tag">No</span>'}</td>
            <td><span class="${STATUS[c.status][0]}">${STATUS[c.status][1]}</span></td>
            <td>${c.status === 'done' ? '' : `<button type="button" class="btn btn--sm btn--primary" data-i="${i}">Call now</button>`}</td></tr>`).join('')}</tbody>`;
      }
      table.addEventListener('click', (e) => {
        const b = e.target.closest('[data-i]');
        if (!b) return;
        const c = ASSIST.callbacks[Number(b.dataset.i)];
        c.status = 'done';
        render();
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = `Dialling the citizen for ${c.ref} (demo). The summary opens in the console.`;
        document.querySelector('.toasts').appendChild(t);
        setTimeout(() => t.remove(), 3000);
      });
      render();
    })();
  </script>
</body>
</html>
